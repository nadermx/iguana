---
# Iguana Comedy on a single VPS: Astro (Node) on :3000, Django (gunicorn) on :8001, Postgres, nginx, supervisor.
#
# First time (after disableroot.yml):
#   ansible-playbook deploy.yml --tags all,first_run,load_data
# Code/content update:
#   ansible-playbook deploy.yml
# New certificates (site, api, mail):
#   ansible-playbook deploy.yml --tags all,certs
# Mail only / mail health check:
#   ansible-playbook mail.yml    ansible-playbook email_check.yml
#
# Code is rsynced from this checkout (not git-pulled) until the repo destination is decided.

- hosts: web
  vars:
    repo_root: "{{ playbook_dir }}/.."
    # Where media is uploaded from (add-only). Override when deploying from a clean git worktree, which has no media.
    media_src: "{{ repo_root }}/backend/media"
    fixture_local: "{{ playbook_dir }}/../backend/local_data.json"
  tasks:
    # ---------------------------------------------------------------- system
    - name: Install system packages
      become: true
      apt:
        update_cache: true
        cache_valid_time: 3600
        pkg: [git, rsync, acl, curl, ca-certificates, gnupg, htop, build-essential, python3-venv, python3-dev,
               python3-psycopg2, libpq-dev, postgresql, postgresql-contrib, nginx, supervisor, certbot, ufw]
      tags: [first_run]

    - name: Add NodeSource key
      become: true
      shell: curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      args: {creates: /etc/apt/keyrings/nodesource.gpg}
      tags: [first_run]

    - name: Add NodeSource Node 20 repo
      become: true
      copy:
        dest: /etc/apt/sources.list.d/nodesource.list
        content: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main\n"
      tags: [first_run]

    - name: Install Node.js 20
      become: true
      apt: {name: nodejs, update_cache: true, state: present}
      tags: [first_run]

    - name: Create 2G swap file
      become: true
      shell: |
        fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args: {creates: /swapfile}
      tags: [first_run]

    - name: Firewall rules
      become: true
      ufw: {rule: allow, port: "{{ item }}", proto: tcp}
      loop: ["22", "25", "80", "443"]
      tags: [first_run]

    - name: Temporary API port until DNS is live
      become: true
      ufw: {rule: allow, port: "8080", proto: tcp, delete: "{{ dns_live | bool }}"}

    - name: Enable firewall
      become: true
      ufw: {state: enabled, policy: deny}
      tags: [first_run]

    # -------------------------------------------------------------- database
    - name: Postgres user
      become: true
      become_user: postgres
      community.postgresql.postgresql_user: {name: "{{ db_user }}", password: "{{ db_password }}"}
      tags: [first_run]

    - name: Postgres database
      become: true
      become_user: postgres
      community.postgresql.postgresql_db: {name: "{{ db_name }}", owner: "{{ db_user }}"}
      tags: [first_run]

    # ------------------------------------------------------------------ code
    - name: App directories
      become: true
      file: {path: "{{ item }}", state: directory, owner: "{{ deploy_user }}", group: "{{ deploy_user }}", mode: "0755"}
      loop: ["/home/www", "{{ app_dir }}", "/var/log/{{ projectname }}", "/var/www/letsencrypt"]

    # backend/media holds admin uploads that exist only on the server. On 2026-09-17 a deploy from a worktree whose
    # backend/media was a symlink slipped past the old "backend/media/" exclude (a trailing slash matches directories
    # only), replaced the server folder with a dangling symlink and took every event image offline. Refuse to sync
    # unless it is a real directory, and exclude the path whatever its type.
    - name: Server media folder is a real directory
      stat: {path: "{{ app_dir }}/backend/media"}
      register: server_media

    - name: Refuse to deploy over a media path that is not a directory
      assert:
        that: not server_media.stat.exists or (server_media.stat.isdir and not server_media.stat.islnk)
        fail_msg: "{{ app_dir }}/backend/media is not a real directory; fix it on the server before deploying"

    - name: Local media source is a real directory
      delegate_to: localhost
      become: false
      stat: {path: "{{ media_src }}", follow: false}
      register: local_media

    - name: Refuse to sync media from a symlink or missing folder
      assert:
        that: local_media.stat.exists and local_media.stat.isdir and not local_media.stat.islnk
        fail_msg: "media_src {{ media_src }} must be a real directory (pass -e media_src=/path/to/backend/media)"

    # The /chat/ agent (agent.yml) commits on the server and pushes to GitHub, then deploys from GitHub. This
    # playbook deploys whatever is in THIS checkout, so a checkout that is behind GitHub would quietly take the
    # agent's work back off the live site. Refuse unless everything pushed is in here (-e allow_behind=true to
    # override, knowingly).
    - name: What is on GitHub that this checkout does not have
      delegate_to: localhost
      become: false
      shell: |
        git -C "{{ repo_root }}" fetch --quiet origin backend-django
        git -C "{{ repo_root }}" log --oneline HEAD..FETCH_HEAD
      register: behind
      changed_when: false

    - name: Refuse to deploy over commits the chat agent pushed
      assert:
        that: behind.stdout == '' or (allow_behind | default(false) | bool)
        fail_msg: "GitHub has commits this checkout lacks (git pull first): {{ behind.stdout_lines }}"

    # The server's record of which commit is live. iguana-agent-deploy reads it and refuses to overwrite a tree
    # that is not a pushed commit, so uncommitted work deployed from here is never erased by the agent.
    - name: Which commit this deploy is
      delegate_to: localhost
      become: false
      shell: |
        sha=$(git -C "{{ repo_root }}" rev-parse HEAD)
        if [ -n "$(git -C "{{ repo_root }}" status --porcelain --untracked-files=no)" ]; then dirty=' dirty'; fi
        if ! git -C "{{ repo_root }}" branch -r --contains "$sha" | grep -q .; then dirty="$dirty unpushed"; fi
        echo "$sha devbox $(date -u +%Y%m%dT%H%M%SZ)$dirty"
      register: deploying
      changed_when: false

    - name: Sync code and archive media
      ansible.posix.synchronize:
        src: "{{ repo_root }}/"
        dest: "{{ app_dir }}/"
        delete: true
        rsync_opts:
          - "--exclude=.git/"
          - "--exclude=node_modules/"
          - "--exclude=dist/"
          - "--exclude=dist.next/"
          - "--exclude=dist.old/"
          - "--exclude=.astro/"
          - "--exclude=.env"
          - "--exclude=.dev.vars"
          - "--exclude=ansible/"
          - "--exclude=backend/.venv/"
          - "--exclude=backend/venv/"
          - "--exclude=backend/config.py"
          - "--exclude=backend/db.sqlite3"
          - "--exclude=backend/staticfiles/"
          - "--exclude=backend/local_data.json"
          - "--exclude=__pycache__/"
          - "--exclude=.wrangler/"
          - "--exclude=/backend/media"
          - "--exclude=/DEPLOYED_COMMIT"

    - name: Sync media without deleting (admin uploads live only on the server)
      ansible.posix.synchronize:
        src: "{{ media_src }}/"
        dest: "{{ app_dir }}/backend/media/"
        delete: false

    - name: Site env (.env)
      template: {src: files/env.j2, dest: "{{ app_dir }}/.env", mode: "0600"}
      register: site_env

    - name: Backend config.py
      template: {src: files/config.py.j2, dest: "{{ app_dir }}/backend/config.py", mode: "0600"}

    # --------------------------------------------------------------- backend
    - name: Backend virtualenv and requirements
      pip:
        requirements: "{{ app_dir }}/backend/requirements.txt"
        virtualenv: "{{ app_dir }}/backend/venv"
        virtualenv_command: python3 -m venv
      # Decides whether the API can be reloaded in place or has to be restarted; see the reload task below.
      register: venv

    - name: Migrate
      command: venv/bin/python manage.py migrate --noinput
      args: {chdir: "{{ app_dir }}/backend"}
      register: migrate
      changed_when: "'No migrations to apply' not in migrate.stdout"

    - name: Collect static
      command: venv/bin/python manage.py collectstatic --noinput
      args: {chdir: "{{ app_dir }}/backend"}
      changed_when: false

    # 🚨 This runs HERE, directly after the migration, not down beside the site restart. It used to sit after
    # the npm install and the Astro build, which is minutes, and in those minutes the database has the new
    # schema while the workers are still running the old code. On 2026-09-21 that window was about ten minutes
    # and a real ad click landed in it: two POSTs to /api/checkout/.../start from a Facebook in-app browser,
    # both 500, because the old code inserted an order line without the column the migration had just made NOT
    # NULL. Nothing was written, so the only trace is the access log.
    #
    # The API serves the checkout iframe and k.js, so a hard restart of it shows a 502 inside the checkout on a
    # live ad click. Gunicorn's master keeps the listening socket across a HUP and rolls its workers, which
    # re-import the code, so a code deploy costs no dropped requests. A dependency change needs the real restart,
    # because the master itself has to come back on the new environment.
    - name: Reload the API gracefully, straight after the migration (no dropped requests)
      become: true
      command: "supervisorctl signal HUP {{ projectname }}:{{ projectname }}-api"
      when: not (venv.changed | default(false))
      changed_when: true

    - name: Restart the API (dependencies changed, so a reload is not enough)
      become: true
      command: "supervisorctl restart {{ projectname }}:{{ projectname }}-api"
      when: venv.changed | default(false)
      changed_when: true

    - name: Load data fixture (contains customer data; always removed afterwards)
      tags: [load_data, never]
      block:
        - name: Upload data fixture
          copy: {src: "{{ fixture_local }}", dest: "{{ app_dir }}/backend/local_data.json", mode: "0600"}
        - name: Load data
          command: venv/bin/python manage.py loaddata local_data.json
          args: {chdir: "{{ app_dir }}/backend"}
      always:
        - name: Remove data fixture
          file: {path: "{{ app_dir }}/backend/local_data.json", state: absent}

    - name: Seed site defaults
      command: venv/bin/python manage.py seed_site_defaults
      args: {chdir: "{{ app_dir }}/backend"}
      changed_when: false

    - name: Admin user
      command: venv/bin/python manage.py shell -c "{{ admin_script }}"
      args: {chdir: "{{ app_dir }}/backend"}
      vars:
        admin_script: >-
          from django.contrib.auth.models import User;
          u = User.objects.filter(username='admin').first() or User(username='admin', email='hello@iguanacomedy.com');
          u.is_staff = u.is_superuser = True;
          u.set_password('''{{ lookup('file', creds + '/admin_password') }}''') if not u.pk else None;
          u.save()
      no_log: true
      tags: [first_run]

    # The owner's own login, as distinct from the `admin` account the first run makes and the `bar` account the
    # door uses. Superuser, so it passes `can_see_the_money` and reaches /stats/ and /revenue/ as well as
    # /reservations/. The password is only ever set when the account is created, so changing it in the admin is
    # not undone by the next deploy.
    - name: Owner account
      become: true
      become_user: "{{ deploy_user }}"
      command: >-
        {{ app_dir }}/backend/venv/bin/python {{ app_dir }}/backend/manage.py shell -c
        "from django.contrib.auth import get_user_model;
        U = get_user_model();
        u = U.objects.filter(username='iguana').first() or U(username='iguana', email='hello@iguanacomedy.com');
        fresh = u.pk is None;
        u.is_staff = u.is_superuser = True;
        u.set_password('''{{ lookup('file', creds + '/owner_password') }}''') if fresh else None;
        u.save();
        print('created' if fresh else 'already there')"
      args: {chdir: "{{ app_dir }}/backend"}
      no_log: true
      changed_when: true

    # The floor console's two accounts: a waiter and the bar, `/mesas/` and nothing else. The command forces
    # `is_staff = False` every run, which is the whole security model: Django's admin turns away a non-staff
    # account at the login form before it consults any permission, so `/admin/` is shut by construction rather
    # than by withholding every model permission one at a time. See `api/floor.py`.
    #
    # Unlike the owner and admin accounts the password IS re-applied every deploy. It is a short shared word
    # typed on a phone behind a bar by whoever is on shift, so pretending it is a secret somebody curates in
    # the admin would be a fiction. To change it, change the credential file and deploy.
    - name: Floor accounts for /mesas/
      become: true
      become_user: "{{ deploy_user }}"
      command:
        cmd: "{{ app_dir }}/backend/venv/bin/python manage.py ensure_floor_accounts --password {{ floor_password }}"
        chdir: "{{ app_dir }}/backend"
      no_log: true
      changed_when: true

    # The point of sale's map and its first manager. Re-runnable: creates what is missing, and never rewrites a
    # PIN (a manager who changed theirs at /pos/personal/ keeps it).
    - name: Point of sale setup
      become: true
      become_user: "{{ deploy_user }}"
      command:
        cmd: "{{ app_dir }}/backend/venv/bin/python manage.py pos_setup --manager {{ pos_manager_name | quote }} --pin {{ pos_manager_pin }}"
        chdir: "{{ app_dir }}/backend"
      no_log: true
      changed_when: true

    # ------------------------------------------------------------------ site
    # `npm ci` DELETES node_modules and rebuilds it, under a Node server that is still serving and still
    # resolving Astro's imports lazily. So every deploy opened a window where a live request could throw
    # ERR_MODULE_NOT_FOUND on a package that was there a second ago: it caught two real requests on
    # 2026-09-23 (`Cannot find package 'piccolore'`). It is the same trap as rebuilding dist in place, one
    # layer down, and almost every deploy ships no dependency change at all. So only reinstall when the
    # lockfile actually differs from what is installed.
    - name: Dependency manifest checksum
      stat: {path: "{{ app_dir }}/package-lock.json", get_checksum: true}
      register: lockfile

    - name: Checksum of the installed dependencies
      slurp: {src: "{{ app_dir }}/node_modules/.iguana-lock-checksum"}
      register: installed_lock
      failed_when: false

    - name: npm ci (only when the lockfile changed)
      command: npm ci --no-audit --no-fund
      args: {chdir: "{{ app_dir }}"}
      when: (installed_lock.content | default('') | b64decode | trim) != lockfile.stat.checksum
      changed_when: true

    - name: Record which lockfile is installed
      copy:
        content: "{{ lockfile.stat.checksum }}"
        dest: "{{ app_dir }}/node_modules/.iguana-lock-checksum"
        mode: "0644"

    # Built BESIDE the live one, never over it. The Node adapter resolves Astro's route modules lazily, so
    # rebuilding dist/ under the running server makes every route it has not yet imported throw
    # ERR_MODULE_NOT_FOUND until the restart -- which is how /en/open-mic/ served 500s for a minute on
    # 2026-09-21 while the open mic ads were pointing at it. A build takes ~30s; a rename takes no time at all.
    - name: Build site into a staging directory (Node adapter)
      command: npm run build:node
      args: {chdir: "{{ app_dir }}"}
      environment:
        NODE_OPTIONS: "--max-old-space-size=1536"
        ASTRO_OUT_DIR: "{{ app_dir }}/dist.next"
      changed_when: true

    - name: Refuse to swap in a build that did not produce a server
      stat: {path: "{{ app_dir }}/dist.next/server/entry.mjs"}
      register: staged_build
      failed_when: not staged_build.stat.exists

    - name: Swap the new build in
      shell: |
        set -e
        rm -rf "{{ app_dir }}/dist.old"
        if [ -d "{{ app_dir }}/dist" ]; then mv "{{ app_dir }}/dist" "{{ app_dir }}/dist.old"; fi
        mv "{{ app_dir }}/dist.next" "{{ app_dir }}/dist"
      args: {executable: /bin/bash}
      changed_when: true

    # ----------------------------------------------------------- nginx/procs
    - name: Wallet verification directory
      become: true
      file: {path: /var/www/wallet, state: directory, mode: '0755'}

    - name: Apple Pay domain verification file
      become: true
      copy:
        src: files/apple-developer-merchantid-domain-association
        dest: /var/www/wallet/apple-developer-merchantid-domain-association
        mode: '0644'

    - name: nginx
      include_tasks: tasks/nginx.yml

    - name: Supervisor programs
      become: true
      template: {src: files/supervisor.conf.j2, dest: "/etc/supervisor/conf.d/{{ projectname }}.conf", mode: "0644"}

    - name: Supervisor update
      become: true
      command: supervisorctl update
      changed_when: false

    # ------------------------------------------------------ IP location data
    - name: IP location refresh script
      become: true
      copy: {src: files/iguana-geoip-refresh, dest: /usr/local/bin/iguana-geoip-refresh, mode: "0755"}

    - name: IP location data directory
      become: true
      file: {path: "{{ geoip_db | dirname }}", state: directory, owner: "{{ deploy_user }}", group: "{{ deploy_user }}", mode: "0755"}

    # /drop/ stores what the owner uploads (IDs, tax papers) here, outside backend/media so nginx can never serve
    # it. 0700: only the app user reads it; copies come off the box through ansible.
    - name: Document drop directory
      become: true
      file: {path: "{{ drop_dir }}", state: directory, owner: "{{ deploy_user }}", group: "{{ deploy_user }}", mode: "0700"}

    # /comic/ keeps comedians' photos and clips here, one folder per submission, for the same reason: unpublished
    # material, never under backend/media. Staff download through the admin or copy off with ansible.
    - name: Comedian submissions directory
      become: true
      file: {path: "{{ comics_dir | default('/var/lib/iguana/comics') }}", state: directory, owner: "{{ deploy_user }}", group: "{{ deploy_user }}", mode: "0700"}

    # ffprobe records each clip's length after a /comic/ upload; ffmpeg is also what cuts those clips for ads.
    - name: ffmpeg for comedians' clips
      become: true
      apt: {name: ffmpeg, state: present, update_cache: true, cache_valid_time: 86400}

    - name: Look for the IP location database
      stat: {path: "{{ geoip_db }}"}
      register: geoip_file

    - name: Download the IP location database when missing
      command: /usr/local/bin/iguana-geoip-refresh {{ geoip_db }}
      when: not geoip_file.stat.exists
      become: true
      become_user: "{{ deploy_user }}"

    - name: Refresh the IP location database monthly (DB-IP publishes on the 1st)
      become: true
      cron:
        name: iguana geoip refresh
        user: "{{ deploy_user }}"
        day: "4"
        hour: "5"
        minute: "17"
        # crm/geo.py reopens the file when it changes, so no restart; results go to syslog (journalctl -t iguana-geoip).
        job: "timeout 30m /usr/local/bin/iguana-geoip-refresh {{ geoip_db }} 2>&1 | logger -t iguana-geoip"

    - name: Honour unsubscribes that arrive as email
      become: true
      become_user: "{{ deploy_user }}"
      cron:
        name: iguana emailed unsubscribes
        user: "{{ deploy_user }}"
        minute: "*/20"
        # Every twenty minutes, because an unsubscribe that waits an hour can still be beaten by the next send,
        # and a complaint costs the whole list's deliverability rather than one address.
        job: >-
          timeout 5m {{ app_dir }}/backend/venv/bin/python {{ app_dir }}/backend/manage.py
          process_unsubscribe_mail --apply 2>&1 | logger -t iguana-unsubscribe

    - name: Stop mailing addresses that permanently do not exist
      become: true
      become_user: "{{ deploy_user }}"
      cron:
        name: iguana hard bounces
        user: "{{ deploy_user }}"
        hour: "6"
        minute: "40"
        # Daily, and deliberately before the Monday send rather than after it: the point is that a dead address
        # is off the list by the time the newsletter runs. Nothing here is urgent enough for every twenty
        # minutes, because a bounce is already a message that failed.
        job: >-
          timeout 10m {{ app_dir }}/backend/venv/bin/python {{ app_dir }}/backend/manage.py
          process_bounces --apply 2>&1 | logger -t iguana-bounces

    - name: Weekly what-is-on email, Monday morning in Playa
      become: true
      cron:
        name: iguana weekly newsletter
        disabled: "{{ not (newsletter_enabled | default(false) | bool) }}"
        user: "{{ deploy_user }}"
        weekday: "1"
        # The box runs UTC and Quintana Roo is UTC-5 with no daylight saving, so 14:00 here is 09:00 there,
        # every week of the year.
        hour: "14"
        minute: "0"
        # It refuses a week with nothing on and refuses to send the same week twice, so a double fire or a
        # rerun is safe. 30m against a send that takes about three minutes at 683 recipients and 0.2s apart.
        job: >-
          timeout 30m {{ app_dir }}/backend/venv/bin/python {{ app_dir }}/backend/manage.py send_whats_on
          --send --lede-file {{ newsletter_lede }} 2>&1 | logger -t iguana-newsletter

    - name: Install the nightly database backup (dump, restore test, prune)
      become: true
      copy:
        src: files/iguana-db-backup.sh
        dest: /usr/local/sbin/iguana-db-backup
        mode: "0755"

    - name: Back the database up every night, after service
      become: true
      cron:
        name: iguana database backup
        cron_file: iguana-backup
        user: root
        # 07:20 UTC is 02:20 in Playa: the bar has closed and nobody is booking. Tested restore included, it
        # takes seconds at this size; the timeout is for a wedged Postgres, not for the work.
        hour: "7"
        minute: "20"
        job: "timeout 30m /usr/local/sbin/iguana-db-backup >/dev/null 2>&1"

    - name: Snapshot what the ads cost, for /stats/
      become: true
      cron:
        name: iguana ad spend snapshot
        user: "{{ deploy_user }}"
        minute: "*/15"
        # The page never calls Meta itself: the ad account's rate limit clears only by waiting, and a Graph
        # outage would otherwise take the dashboard down with it. Stale numbers with an honest timestamp beat
        # a 500 at the moment somebody wants to know whether to keep spending.
        job: >-
          timeout 5m {{ app_dir }}/backend/venv/bin/python {{ app_dir }}/backend/manage.py
          snapshot_ad_spend 2>&1 | logger -t iguana-ad-spend

    - name: Keep about three months of open mic nights on the calendar
      become: true
      cron:
        name: iguana open mic calendar
        user: "{{ deploy_user }}"
        # Sundays 12:00 UTC (07:00 Playa). It only CREATES missing weeks and sets those up; every night that
        # already exists is left alone, so a night drafted for a holiday is not republished.
        weekday: "0"
        hour: "12"
        minute: "5"
        job: >-
          timeout 10m {{ app_dir }}/backend/venv/bin/python {{ app_dir }}/backend/manage.py setup_open_mics
          --weeks-ahead 14 --only-new 2>&1 | logger -t iguana-open-mic-calendar

    - name: Keep the open mic ads on unless their night is full or an hour from starting
      become: true
      cron:
        name: iguana open mic ads autopilot
        disabled: "{{ not (open_mic_ads_autopilot | default(true) | bool) }}"
        user: "{{ deploy_user }}"
        # Every ten minutes so the stop lands close to the hour-before mark (20:00 for a 21:00 show). It reads
        # the account's campaigns once and posts only when a status is wrong, so a quiet run is one GET.
        minute: "*/10"
        job: >-
          timeout 5m {{ app_dir }}/backend/venv/bin/python {{ app_dir }}/backend/manage.py
          open_mic_ads --apply 2>&1 | logger -t iguana-open-mic-ads

    - name: Morning-of reminder to tonight's audience
      become: true
      cron:
        name: iguana show reminders
        disabled: "{{ not (show_reminders_enabled | default(true) | bool) }}"
        user: "{{ deploy_user }}"
        # 15:00 UTC is 10:00 in Playa: early enough that a released open mic seat can still be booked by
        # somebody else during the day, late enough not to land before people are up. Stamped per booking, so
        # a double fire or a hand re-run sends nothing twice.
        hour: "15"
        minute: "0"
        job: >-
          timeout 20m {{ app_dir }}/backend/venv/bin/python {{ app_dir }}/backend/manage.py send_show_reminders
          --send 2>&1 | logger -t iguana-show-reminders

    - name: Morning-after note to last night's audience
      become: true
      cron:
        name: iguana after-show follow up
        disabled: "{{ not (after_show_enabled | default(true) | bool) }}"
        user: "{{ deploy_user }}"
        # 16:00 UTC is 11:00 in Playa: late enough that a show ending at 23:00 is properly "last night", and
        # early enough that the next open mic is still something they can invite somebody to this week.
        hour: "16"
        minute: "0"
        # Every booking it considers is stamped, so a double fire or a hand re-run sends nothing twice.
        job: >-
          timeout 20m {{ app_dir }}/backend/venv/bin/python {{ app_dir }}/backend/manage.py send_after_show
          --send 2>&1 | logger -t iguana-after-show

    - name: Restart the site
      become: true
      command: "supervisorctl restart {{ projectname }}:{{ projectname }}-web"
      changed_when: true

    # Never walk away from a deploy without knowing the thing an ad click lands on is actually answering. Both
    # are local, so this is a sub-second check, and a failure here fails the play rather than going quiet.
    - name: Wait for the site and the checkout to answer again
      uri:
        url: "{{ item }}"
        status_code: 200
        timeout: 10
      register: back_up
      retries: 15
      delay: 2
      until: back_up is succeeded
      loop:
        - "http://127.0.0.1:3000/en/open-mic/"
        - "http://127.0.0.1:8001/_t/k.js"

    - name: Record the live commit (the chat worker restarts itself when this changes)
      copy: {content: "{{ deploying.stdout }}\n", dest: "{{ app_dir }}/DEPLOYED_COMMIT", mode: "0644"}

    # ----------------------------------------------------------------- certs
    - name: Obtain certificates (needs DNS pointing here)
      become: true
      command: >-
        certbot certonly --webroot -w /var/www/letsencrypt -n --agree-tos -m {{ certbot_email }}
        --cert-name {{ item.name }} {{ item.domains | map('regex_replace', '^', '-d ') | join(' ') }}
      args: {creates: "/etc/letsencrypt/live/{{ item.name }}/fullchain.pem"}
      loop: "{{ cert_sets }}"
      when: dns_live | bool
      register: new_certs
      tags: [certs, never]

    - name: Re-render nginx with the new certificates
      include_tasks: tasks/nginx.yml
      when: new_certs is changed
      tags: [certs, never]

    - name: Reload nginx after certificate renewals
      become: true
      copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        content: "#!/bin/sh\nsystemctl reload nginx\nsystemctl reload postfix\n"
        mode: "0755"
      tags: [certs, never]

    - name: Wait for the site
      uri: {url: "http://127.0.0.1:3000/en/", status_code: 200}
      register: health
      retries: 10
      delay: 3
      until: health.status == 200

- import_playbook: agent.yml
- import_playbook: mail.yml
